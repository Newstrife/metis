test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

local:
  service: Disk
  root: <%= Rails.root.join("storage") %>

# S3 (production). Driven by ENV so one config serves AWS S3 and any
# S3-compatible store (Cloudflare R2, MinIO, …). Selected when AWS_BUCKET is
# set — see config/environments/production.rb. For R2/MinIO also set
# AWS_ENDPOINT (R2's region is "auto").
amazon:
  service: S3
  access_key_id: <%= ENV["AWS_ACCESS_KEY_ID"] %>
  secret_access_key: <%= ENV["AWS_SECRET_ACCESS_KEY"] %>
  region: <%= ENV.fetch("AWS_REGION", "us-east-1") %>
  bucket: <%= ENV["AWS_BUCKET"] %>
  # endpoint/force_path_style only matter for S3-compatible stores (R2, MinIO);
  # blank AWS_ENDPOINT leaves standard AWS S3 untouched.
  endpoint: <%= ENV["AWS_ENDPOINT"].presence %>
  force_path_style: <%= ENV["AWS_ENDPOINT"].present? %>

# Remember not to checkin your GCS keyfile to a repository
# google:
#   service: GCS
#   project: your_project
#   credentials: <%= Rails.root.join("path/to/gcs.keyfile") %>
