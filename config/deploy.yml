<%# Deploy host + public domain live in the gitignored .env.deploy so this
    file stays safe to publish. Copy the keys from .env.example. %>
<% require "dotenv"; Dotenv.load(".env.deploy") if File.exist?(".env.deploy") -%>

# Name of your application. Used to uniquely configure containers.
service: metis

# Name of the container image (use your-user/app-name on external registries).
image: metis

# Shares the EC2 host with flakes (browser-api). Both apps run as distinct
# Kamal services behind the host's single kamal-proxy.
ssh:
  user: ubuntu

servers:
  web:
    hosts:
      - <%= ENV.fetch("KAMAL_WEB_IP") %>
  # job:
  #   hosts:
  #     - <%= ENV.fetch("KAMAL_WEB_IP") %>
  #   cmd: bin/jobs

# TLS is terminated upstream at the ELB, so kamal-proxy runs plain HTTP on :80
# and host-routes by the Host header. This is what lets metis share the host's
# single kamal-proxy with flakes (browser-api) — each app claims its own host
# instead of fighting over the catch-all route. Requires config.assume_ssl and
# config.force_ssl in production.rb (set).
proxy:
  ssl: false
  host: <%= ENV.fetch("METIS_HOST") %>

# Where you keep your container images.
registry:
  # Alternatives: hub.docker.com / registry.digitalocean.com / ghcr.io / ...
  server: localhost:5555

  # Needed for authenticated registries.
  # username: your-user

  # Always use an access token rather than real password when possible.
  # password:
  #   - KAMAL_REGISTRY_PASSWORD

# Inject ENV variables into containers (secrets come from .kamal/secrets).
env:
  secret:
    - RAILS_MASTER_KEY
    # Multi-database Solid setup on the shared RDS instance. Distinct
    # metis_* database names keep us off flakes' databases. URLs are sourced
    # from credentials in .kamal/secrets.
    - DATABASE_URL
    - CACHE_DATABASE_URL
    - CABLE_DATABASE_URL
    - QUEUE_DATABASE_URL
    # Cloudflare Email Service token (and every provider/OAuth secret your
    # deployment uses) — values come from .kamal/secrets. See .env.example
    # for the full list the app reads in production.
    - CLOUDFLARE_EMAIL_API_TOKEN
    # Active Storage S3 credentials (sourced from credentials in .kamal/secrets).
    - AWS_ACCESS_KEY_ID
    - AWS_SECRET_ACCESS_KEY
    # LLM provider keys (ANTHROPIC_API_KEY required — default provider).
    - ANTHROPIC_API_KEY
    - OPENAI_API_KEY
    - GEMINI_API_KEY
    - DEEPSEEK_API_KEY
    - FIREWORKS_API_KEY
    # GitHub + Google connector OAuth (client pairs + GitHub App private key).
    - GITHUB_APP_CLIENT_ID
    - GITHUB_APP_CLIENT_SECRET
    - GITHUB_APP_PRIVATE_KEY
    - GOOGLE_OAUTH_CLIENT_ID
    - GOOGLE_OAUTH_CLIENT_SECRET
    # E2B microVM runtime key.
    - E2B_API_KEY
  clear:
    # Run the Solid Queue Supervisor inside the web server's Puma process to do jobs.
    # When you start using multiple servers, you should split out job processing to a dedicated machine.
    SOLID_QUEUE_IN_PUMA: true

    # --- Outbound email + invite links ---
    # Sender must be on the Cloudflare-verified domain; METIS_APP_HOST is
    # the host invitation/reset links point at (match proxy.host above).
    METIS_MAIL_FROM: "Metis <noreply@<%= ENV.fetch('METIS_HOST') %>>"
    METIS_APP_HOST: <%= ENV.fetch("METIS_HOST") %>
    CLOUDFLARE_ACCOUNT_ID: <%= ENV.fetch("CLOUDFLARE_ACCOUNT_ID") %>

    # Account access: invite_only (default) or open. invite_only means the
    # first account bootstraps and everyone else needs an invitation.
    METIS_REGISTRATION_MODE: invite_only

    # --- Agent runtime ---
    # e2b runs pi in an isolated microVM (a security boundary, unlike local).
    # Provider/model are the deployment defaults when a conversation sets none.
    METIS_AGENT_RUNTIME: e2b
    METIS_AGENT_PROVIDER: anthropic
    METIS_AGENT_MODEL: anthropic/claude-opus-4-8
    METIS_E2B_TEMPLATE: metis-pi
    METIS_E2B_EVICTION_HOURS: "24"

    # --- GitHub connector identifiers (not secret, but kept out of the public
    # repo via .env.deploy alongside the host/domain). Client secret + private
    # key are in env.secret above.
    GITHUB_APP_ID: "<%= ENV.fetch('GITHUB_APP_ID') %>"
    GITHUB_APP_SLUG: <%= ENV.fetch("GITHUB_APP_SLUG") %>
    GITHUB_APP_INSTALLATION_ID: "<%= ENV.fetch('GITHUB_APP_INSTALLATION_ID') %>"

    # Puma threads per process (also the AR connection pool size).
    RAILS_MAX_THREADS: "5"

    # --- Active Storage (S3 / S3-compatible) ---
    # Setting AWS_BUCKET switches uploads from the (ephemeral) container disk
    # to S3. For Cloudflare R2 / MinIO, set AWS_REGION: auto and AWS_ENDPOINT
    # to the account endpoint. Keys live in env.secret above.
    AWS_BUCKET: metis-uploads
    AWS_REGION: us-west-1
    # AWS_ENDPOINT: https://<account>.r2.cloudflarestorage.com

    # Set number of processes dedicated to Solid Queue (default: 1)
    JOB_CONCURRENCY: "3"

    # Set number of cores available to the application on each server (default: 1).
    WEB_CONCURRENCY: "2"

    # Match this to any external database server to configure Active Record correctly
    # Use metis-db for a db accessory server on same machine via local kamal docker network.
    # DB_HOST: 192.168.0.2

    # Log everything from Rails
    # RAILS_LOG_LEVEL: debug

# Aliases are triggered with "bin/kamal <alias>". You can overwrite arguments on invocation:
# "bin/kamal logs -r job" will tail logs from the first server in the job section.
aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

# Use a persistent storage volume for sqlite database files and local Active Storage files.
# Recommended to change this to a mounted volume path that is backed up off server.
volumes:
  - "metis_storage:/rails/storage"

# Bridge fingerprinted assets, like JS and CSS, between versions to avoid
# hitting 404 on in-flight requests. Combines all files from new and old
# version inside the asset_path.
asset_path: /rails/public/assets

# The EC2 host is arm64 (Graviton), matching flakes/browser-api.
builder:
  arch: arm64

  # # Build image via remote server (useful for faster amd64 builds on arm64 computers)
  # remote: ssh://docker@docker-builder-server
  #
  # # Pass arguments and secrets to the Docker build process
  # args:
  #   RUBY_VERSION: ruby-4.0.5
