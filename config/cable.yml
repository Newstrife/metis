# ChatJob runs in the bin/jobs supervisor process, so broadcasts must cross
# processes — solid_cable (DB-backed) instead of in-process async.
development:
  adapter: solid_cable
  polling_interval: 0.1.seconds
  message_retention: 1.day

test:
  adapter: test

production:
  adapter: solid_cable
  connects_to:
    database:
      writing: cable
  polling_interval: 0.1.seconds
  message_retention: 1.day
