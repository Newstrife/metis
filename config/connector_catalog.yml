# The connector marketplace catalog — curated MCP-server "apps".
#
# Each entry is a template: connecting one resolves it (with any user
# `inputs`) into a team's Connector, and the `credential` schema shapes
# the secret the user supplies into a ConnectorCredential. See
# docs/connectors.md.
#
# auth:
#   token — the user supplies a key/token
#   oauth — Metis brokers an OAuth flow; per-member access tokens

github:
  name: GitHub
  category: Development
  description: Repositories, issues, pull requests, and code search.
  transport: http
  definition:
    url: https://api.githubcopilot.com/mcp/
  auth: oauth
  oauth_provider: github
  oauth_scopes:
    - repo
    - read:user
  credential:
    header: Authorization
    format: "Bearer %{token}"

gmail:
  name: Gmail
  category: Productivity
  description: Search, read, draft, and label Gmail messages as the operator.
  transport: http
  definition:
    # Self-hosted google_workspace_mcp (chagel/google_workspace_mcp) in
    # external OAuth mode (MCP_ENABLE_OAUTH21=true). The bearer is
    # metis's per-user OauthGrant for Google; the server validates it
    # against Google's userinfo API on every request and dispatches
    # tools based on the token's scopes. The same server hosts every
    # Google connector (Gmail, Calendar, …); the bearer's scopes decide
    # what each one can call. Override WORKSPACE_MCP_URL in the
    # environment when running it somewhere other than the dev shell.
    url: <%= ENV.fetch("WORKSPACE_MCP_URL", "http://localhost:10299/mcp/") %>
  auth: oauth
  oauth_provider: google
  # The full scope set workspace-mcp's `gmail:drafts` permission tier
  # cumulatively expects: readonly (search/get) + labels + modify
  # (label_thread/message) + compose (draft creation). Asking for them
  # all up front means one consent screen covers every Gmail tool the
  # server exposes.
  oauth_scopes:
    - https://www.googleapis.com/auth/gmail.readonly
    - https://www.googleapis.com/auth/gmail.labels
    - https://www.googleapis.com/auth/gmail.modify
    - https://www.googleapis.com/auth/gmail.compose
  credential:
    header: Authorization
    format: "Bearer %{token}"

google_calendar:
  name: Google Calendar
  category: Productivity
  description: Read and manage calendars, events, and invitations as the operator.
  transport: http
  definition:
    # Same self-hosted workspace_mcp instance as gmail (see above) —
    # the server dispatches calendar tools when the bearer carries
    # calendar scopes.
    url: <%= ENV.fetch("WORKSPACE_MCP_URL", "http://localhost:10299/mcp/") %>
  auth: oauth
  oauth_provider: google
  # workspace-mcp's `calendar:full` tier: read + write on the user's
  # calendars and event collection. One consent screen, all calendar
  # tools (list/get/create/update/delete events, list calendars, …).
  oauth_scopes:
    - https://www.googleapis.com/auth/calendar
    - https://www.googleapis.com/auth/calendar.events
  credential:
    header: Authorization
    format: "Bearer %{token}"
